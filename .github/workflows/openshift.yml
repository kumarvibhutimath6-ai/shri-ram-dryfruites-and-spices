name: OpenShift CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

# GitHub permissions required to push images to GHCR
permissions:
  contents: read
  packages: write

env:
  # OpenShift credentials (configure these in GitHub repository secrets)
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}

  # OpenShift namespace (leave blank to use default namespace)
  OPENSHIFT_NAMESPACE: ""

  # Application configuration
  APP_NAME: ""
  APP_PORT: "5000"

  # GitHub Container Registry configuration
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_REGISTRY_USER: ${{ github.actor }}
  IMAGE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # Container image tags (generated automatically)
  IMAGE_TAGS: ""

jobs:
  openshift-ci-cd:
    name: Build and Deploy Application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    outputs:
      ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
      SELECTOR: ${{ steps.deploy-and-expose.outputs.selector }}

    steps:

      # 1. Validate required secrets
      - name: Check Required Secrets
        id: check-openshift-secrets
        uses: actions/github-script@v7
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        with:
          script: |
            const required = [
              "OPENSHIFT_SERVER",
              "OPENSHIFT_TOKEN"
            ];

            const missing = required.filter(
              name => !process.env[name]
            );

            if (missing.length > 0) {
              core.notice(`Missing required secrets: ${missing.join(", ")}. Skipping OpenShift login and deployment.`);
              core.setOutput("has_openshift_secrets", "false");
            } else {
              core.info("All required OpenShift secrets are configured.");
              core.setOutput("has_openshift_secrets", "true");
            }

      - name: Skip OpenShift deployment when secrets are not configured
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets != 'true' }}
        shell: bash
        run: |
          echo "OpenShift deployment skipped because required secrets are not configured."
          echo "Set OPENSHIFT_SERVER and OPENSHIFT_TOKEN in the repository or production environment secrets to enable deployment."

      # 2. Checkout GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3. Validate Dockerfile
      - name: Validate Dockerfile
        shell: bash
        run: |
          if [[ ! -f Dockerfile ]]; then
            echo "ERROR: Dockerfile not found in repository root."
            exit 1
          fi

          echo "Dockerfile found successfully."

      # 4. Generate application name
      - name: Determine Application Name
        shell: bash
        run: |
          APP_NAME="${GITHUB_REPOSITORY##*/}"

          APP_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          APP_NAME=$(echo "$APP_NAME" | sed 's/[^a-z0-9-]/-/g')
          APP_NAME=$(echo "$APP_NAME" | sed 's/^-*//; s/-*$//')
          APP_NAME=$(echo "$APP_NAME" | cut -c1-63)
          APP_NAME=$(echo "$APP_NAME" | sed 's/-*$//')

          if [[ -z "$APP_NAME" ]]; then
            echo "ERROR: Invalid application name."
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          echo "Application name: $APP_NAME"

      # 5. Generate container image tags
      - name: Determine Image Tags
        shell: bash
        run: |
          IMAGE_TAGS="latest ${GITHUB_SHA::12}"

          echo "IMAGE_TAGS=$IMAGE_TAGS" >> "$GITHUB_ENV"

          echo "Image tags: $IMAGE_TAGS"

      # 5b. Authenticate to GHCR for the base image used by Dockerfile
      - name: Authenticate to GHCR for base image
        shell: bash
        env:
          GHCR_BASE_USERNAME: ${{ secrets.GHCR_BASE_USERNAME }}
          GHCR_BASE_TOKEN: ${{ secrets.GHCR_BASE_TOKEN }}
        run: |
          if [[ -n "${GHCR_BASE_USERNAME}" && -n "${GHCR_BASE_TOKEN}" ]]; then
            echo "Logging in to GHCR to access the GitHub-provided base image."
            echo "${GHCR_BASE_TOKEN}" | buildah login ghcr.io \
              --username "${GHCR_BASE_USERNAME}" \
              --password-stdin
          else
            echo "No GHCR base-image credentials configured. If the base image is private, add GHCR_BASE_USERNAME/GHCR_BASE_TOKEN secrets."
          fi

      # 6. Build container image using Buildah
      - name: Build Docker Image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.APP_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          dockerfiles: |
            ./Dockerfile

      # 7. Push image to GitHub Container Registry
      - name: Push Image to GHCR
        id: push-image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_REGISTRY_USER }}
          password: ${{ env.IMAGE_REGISTRY_PASSWORD }}

      # 8. Display pushed image
      - name: Verify Container Image
        shell: bash
        env:
          IMAGE_PATH: ${{ steps.push-image.outputs.registry-path }}
        run: |
          if [[ -z "$IMAGE_PATH" ]]; then
            echo "ERROR: Image push failed."
            exit 1
          fi

          echo "Container image pushed successfully."
          echo "$IMAGE_PATH"

      # 9. Install OpenShift CLI
      - name: Install OpenShift CLI
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets == 'true' }}
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4

      # 10. Login to OpenShift cluster
      - name: Login to OpenShift
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets == 'true' }}
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: false
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      # 11. Verify OpenShift connection
      - name: Verify OpenShift Connection
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets == 'true' }}
        shell: bash
        run: |
          echo "Checking OpenShift connection..."

          oc whoami

          echo "Current OpenShift project:"
          oc project

          echo "OpenShift connection successful."

      # 12. Deploy application and expose public route
      - name: Create and Expose Application
        id: deploy-and-expose
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets == 'true' }}
        uses: redhat-actions/oc-new-app@v1
        with:
          app_name: ${{ env.APP_NAME }}
          image: ${{ steps.push-image.outputs.registry-path }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}
          port: ${{ env.APP_PORT }}

      # 13. Verify deployment
      - name: Verify Application Deployment
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets == 'true' }}
        shell: bash
        run: |
          echo "Checking deployment resources..."

          oc get deployments
          oc get pods
          oc get services
          oc get routes

      # 14. Print application public URL
      - name: Print Application URL
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets == 'true' }}
        env:
          ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
          SELECTOR: ${{ steps.deploy-and-expose.outputs.selector }}
        shell: bash
        run: |
          if [[ -z "$ROUTE" ]]; then
            echo "ERROR: Application route was not generated."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "       APPLICATION DEPLOYED SUCCESSFULLY"
          echo "=============================================="
          echo ""
          echo "Application URL:"
          echo "$ROUTE"
          echo ""
          echo "Application Selector:"
          echo "$SELECTOR"
          echo ""
          echo "To delete the application, run:"
          echo "oc delete all --selector='$SELECTOR'"
          echo ""
          echo "=============================================="

      # 15. Display final deployment information
      - name: Deployment Summary
        if: ${{ steps.check-openshift-secrets.outputs.has_openshift_secrets == 'true' && success() }}
        env:
          ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
          IMAGE_PATH: ${{ steps.push-image.outputs.registry-path }}
        run: |
          echo "## OpenShift Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application: $APP_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public URL: $ROUTE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Port: $APP_PORT" >> "$GITHUB_STEP_SUMMARY"
