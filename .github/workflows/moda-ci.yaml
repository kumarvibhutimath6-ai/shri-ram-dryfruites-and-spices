
name: docs-internal Moda CI

# Moda CI workflow
# Reference:
# https://github.com/github/ops/blob/master/docs/playbooks/build-systems/moving-moda-apps-from-bp-to-actions.md

on:
  workflow_dispatch:

  push:
    branches-ignore:
      - 'gh-readonly-queue/**'

  merge_group:
    types:
      - checks_requested

# No permissions by default.
permissions: {}

jobs:

  # ==========================================
  # JOB 1: SET VAULT KEYS
  # ==========================================

  set-vault-keys:
    # Skip duplicate merge queue bot pushes to main.
    # zizmor: ignore[bot-conditions]
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]') }}

    permissions: {}

    runs-on: ubuntu-latest

    outputs:
      modified_vault_keys: ${{ steps.modify_vault_keys.outputs.modified }}

    steps:
      - name: Set Vault Keys
        id: modify_vault_keys

        env:
          VAULT_KEYS: ${{ vars.VAULT_KEYS }}

        shell: bash

        run: |
          if [ -z "$VAULT_KEYS" ]; then
            echo "modified=DOCS_BOT_PAT_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "modified=${VAULT_KEYS},DOCS_BOT_PAT_BASE" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================
  # JOB 2: MODA CONFIGURATION BUNDLE
  # ==========================================

  moda-config-bundle:
    if: ${{ github.repository == 'github/docs-internal' }}

    name: docs-internal-moda-config-bundle

    needs:
      - set-vault-keys

    permissions:
      actions: read
      attestations: write
      checks: read
      contents: read
      id-token: write
      statuses: read

    strategy:
      fail-fast: false

      matrix:
        ci_job:
          - job: docs-internal-moda-config-bundle

    uses: github/internal-actions/.github/workflows/moda.yml@main

    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ needs.set-vault-keys.outputs.modified_vault_keys }}

    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  # ==========================================
  # JOB 3: DOCKER IMAGE BUILD
  # ==========================================

  docker-image:
    if: ${{ github.repository == 'github/docs-internal' }}

    name: docs-internal-docker-image

    needs:
      - set-vault-keys

    permissions:
      actions: read
      attestations: write
      checks: read
      contents: read
      id-token: write
      statuses: read

    strategy:
      fail-fast: false

      matrix:
        ci_job:
          - job: docs-internal-docker-image

    uses: github/internal-actions/.github/workflows/kube.yml@main

    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ needs.set-vault-keys.outputs.modified_vault_keys }}
      attest: true
      docker-build-env-secrets: 'DOCS_BOT_PAT_BASE'

    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  # ==========================================
  # JOB 4: DOCKER SECURITY SCAN
  # ==========================================

  docker-security:
    if: ${{ github.repository == 'github/docs-internal' }}

    name: docs-internal-docker-security

    needs:
      - set-vault-keys

    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      statuses: read

    strategy:
      fail-fast: false

      matrix:
        ci_job:
          - job: docs-internal-docker-security

    uses: github/internal-actions/.github/workflows/docker_security.yml@main

    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ needs.set-vault-keys.outputs.modified_vault_keys }}
      docker-build-env-secrets: 'DOCS_BOT_PAT_BASE'

    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
